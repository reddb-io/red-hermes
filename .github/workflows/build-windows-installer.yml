name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      preview_platforms:
        type: boolean
        description: Show selected platforms without running builds, tests or publication
        default: false

permissions:
  contents: read

jobs:
  # Gate: workflow_dispatch is already restricted to users with write access,
  # but we want ADMIN-only. Explicitly check the triggering actor's repo
  # permission via the API and fail fast for anyone below admin.
  platforms:
    name: Select platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    outputs:
      linux_x64: ${{ steps.select.outputs.linux_x64 }}
      linux_arm64: ${{ steps.select.outputs.linux_arm64 }}
      windows_x64: ${{ steps.select.outputs.windows_x64 }}
      windows_arm64: ${{ steps.select.outputs.windows_arm64 }}
      macos_x64: ${{ steps.select.outputs.macos_x64 }}
      macos_arm64: ${{ steps.select.outputs.macos_arm64 }}
      linux_armv7: ${{ steps.select.outputs.linux_armv7 }}
      linux_x86: ${{ steps.select.outputs.linux_x86 }}
      any: ${{ steps.select.outputs.any }}
      docker_platforms: ${{ steps.select.outputs.docker_platforms }}
    steps:
      - id: select
        name: Filter platforms before allocating runners
        shell: python
        env:
          PLATFORM_DEFAULTS: '{"linux_x64":true,"linux_arm64":true,"windows_x64":true,"windows_arm64":false,"macos_x64":false,"macos_arm64":false,"linux_armv7":false,"linux_x86":false}'
          PLATFORM_AVAILABLE: '["windows_x64"]'
          PLATFORM_MATRICES: |
            {}
        run: |
          import json
          import os

          defaults = json.loads(os.environ["PLATFORM_DEFAULTS"])
          enabled = {}
          for key in defaults:
              name = "ENABLE_" + key.upper()
              value = os.environ[name].lower()
              if value not in ("true", "false"):
                  raise SystemExit(f"{name} must be true or false, got {value!r}")
              enabled[key] = value == "true"

          matrices = json.loads(os.environ["PLATFORM_MATRICES"])
          available = json.loads(os.environ["PLATFORM_AVAILABLE"])
          output = {key: str(value).lower() for key, value in enabled.items()}
          output["any"] = str(any(enabled[key] for key in available)).lower()
          for job, entries in matrices.items():
              selected = [entry["row"] for entry in entries if enabled[entry["flag"]]]
              output["enabled_" + job] = str(bool(selected)).lower()
              # A placeholder keeps GitHub's matrix schema valid when the job is skipped.
              output["matrix_" + job] = json.dumps({"include": selected or [entries[0]["row"]]}, separators=(",", ":"))
          docker = [target for key, target in (("linux_x64", "linux/amd64"), ("linux_arm64", "linux/arm64")) if enabled[key]]
          output["docker_platforms"] = ",".join(docker)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              for key, value in output.items():
                  handle.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("### Selected platforms\n\n")
              for key in available:
                  handle.write(f"- {key}: {str(enabled[key]).lower()}\n")
  authorize:
    name: Authorize (admins only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check actor is a repo admin
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          perm=$(gh api \
            "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" \
            --jq '.permission')
          echo "Actor '${ACTOR}' has permission: ${perm}"
          if [ "${perm}" != "admin" ]; then
            echo "::error::'${ACTOR}' is not a repo admin (permission=${perm}). Refusing to build/sign."
            exit 1
          fi
          echo "Authorized: '${ACTOR}' is an admin."

    needs:
      - platforms
    if: ${{ !inputs.preview_platforms && (needs.platforms.outputs.any == 'true') }}
  build:
    name: Hermes-Setup.exe
    needs:
      - authorize
      - platforms
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required for OIDC auth to Azure (azure/login federated credentials).
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Rust targets
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: apps/bootstrap-installer/src-tauri

      - name: Build installer
        run: npm run tauri:build
        working-directory: apps/bootstrap-installer

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Hermes-Setup.exe with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          # Sign both the raw exe and the bundled NSIS installer.
          files-folder: ${{ github.workspace }}\apps\bootstrap-installer\src-tauri\target\release
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Hermes-Setup-installer
          path: apps/bootstrap-installer/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload raw exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Hermes-Setup-exe
          path: apps/bootstrap-installer/src-tauri/target/release/Hermes-Setup.exe
    if: ${{ !inputs.preview_platforms && (needs.platforms.outputs.windows_x64 == 'true') }}
env:
  ENABLE_LINUX_X64: ${{ vars.ENABLE_LINUX_X64 || 'true' }}
  ENABLE_LINUX_ARM64: ${{ vars.ENABLE_LINUX_ARM64 || 'true' }}
  ENABLE_WINDOWS_X64: ${{ vars.ENABLE_WINDOWS_X64 || 'true' }}
  ENABLE_WINDOWS_ARM64: ${{ vars.ENABLE_WINDOWS_ARM64 || 'false' }}
  ENABLE_MACOS_X64: ${{ vars.ENABLE_MACOS_X64 || 'false' }}
  ENABLE_MACOS_ARM64: ${{ vars.ENABLE_MACOS_ARM64 || 'false' }}
  ENABLE_LINUX_ARMV7: ${{ vars.ENABLE_LINUX_ARMV7 || 'false' }}
  ENABLE_LINUX_X86: ${{ vars.ENABLE_LINUX_X86 || 'false' }}
